<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกรายรับ-รายจ่าย</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font (Kanit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>

  <!-- Firebase Compatibility SDKs (v9 syntax via compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center justify-start p-4">

  <!-- Main Container -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden min-h-[600px] flex flex-col justify-between my-auto">
    
    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 text-center shadow-sm relative">
      <h1 class="text-xl font-bold tracking-wide">Expense Tracker</h1>
      <p class="text-xs text-emerald-100 mt-1">บันทึกรายรับ-รายจ่ายส่วนตัว</p>
      
      <!-- Logout Button -->
      <button id="logout-btn" class="hidden absolute right-4 top-4 bg-emerald-700 hover:bg-emerald-800 text-xs text-white py-1 px-3 rounded-full transition">
        ออกจากระบบ
      </button>
    </header>

    <!-- Main Content Body -->
    <main class="p-5 flex-1 flex flex-col justify-center">

      <!-- ==================== VIEW 1: LOGIN ==================== -->
      <section id="login-view" class="space-y-4">
        <h2 class="text-lg font-bold text-gray-700 text-center mb-2">เข้าสู่ระบบ</h2>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">อีเมล</label>
          <input type="email" id="login-email" placeholder="example@email.com" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">รหัสผ่าน</label>
          <input type="password" id="login-password" placeholder="••••••••" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <button id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">
          เข้าสู่ระบบด้วยอีเมล
        </button>

        <!-- Social Logins Divider -->
        <div class="flex items-center my-3">
          <div class="flex-grow border-t border-gray-200"></div>
          <span class="px-3 text-xs text-gray-400 uppercase">หรือเข้าสู่ระบบด้วย</span>
          <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Google Login Button Only -->
        <button id="google-login-btn" class="w-full flex items-center justify-center py-2 px-3 border border-gray-300 rounded-lg text-xs font-medium text-gray-700 hover:bg-gray-50 transition shadow-sm">
          <svg class="w-4 h-4 mr-2" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.14 0 9.87 0 12s.43 3.86 1.18 5.38l4.09-3.14z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          Google Account
        </button>

        <div class="text-center pt-3 border-t border-gray-100">
          <p class="text-xs text-gray-500">ยังไม่มีบัญชีใช้งาน?</p>
          <button id="go-to-register-btn" class="text-xs font-semibold text-emerald-600 hover:underline mt-1">
            สมัครสมาชิกใหม่ด้วยอีเมล
          </button>
        </div>
      </section>

      <!-- ==================== VIEW 2: REGISTER ==================== -->
      <section id="register-view" class="hidden space-y-4">
        <h2 class="text-lg font-bold text-gray-700 text-center mb-2">สมัครสมาชิก</h2>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">อีเมล</label>
          <input type="email" id="reg-email" placeholder="example@email.com" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
          <input type="password" id="reg-password" placeholder="••••••••" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ยืนยันรหัสผ่าน (Confirm Password)</label>
          <input type="password" id="reg-confirm-password" placeholder="••••••••" class="w-full px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <button id="register-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">
          ยืนยันการสมัครสมาชิก
        </button>

        <div class="text-center pt-3 border-t border-gray-100">
          <button id="back-to-login-btn" class="text-xs font-semibold text-gray-500 hover:underline">
            ← ย้อนกลับไปหน้าเข้าสู่ระบบ
          </button>
        </div>
      </section>

      <!-- ==================== VIEW 3: DASHBOARD ==================== -->
      <section id="dashboard-view" class="hidden space-y-5">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
            <p class="text-[10px] font-semibold text-emerald-600 uppercase tracking-wider">รายรับรวม</p>
            <p id="total-income" class="text-sm font-bold text-emerald-700 mt-1">฿0.00</p>
          </div>
          <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
            <p class="text-[10px] font-semibold text-rose-600 uppercase tracking-wider">รายจ่ายรวม</p>
            <p id="total-expense" class="text-sm font-bold text-rose-700 mt-1">฿0.00</p>
          </div>
          <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
            <p class="text-[10px] font-semibold text-blue-600 uppercase tracking-wider">คงเหลือ</p>
            <p id="total-balance" class="text-sm font-bold text-blue-700 mt-1">฿0.00</p>
          </div>
        </div>

        <!-- Add Transaction Form -->
        <form id="add-form" class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-3">
          <h3 class="text-xs font-bold text-gray-600 uppercase">บันทึกรายการใหม่</h3>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] text-gray-500 mb-1">ประเภท</label>
              <select id="tx-type" class="w-full px-2 py-1.5 text-xs border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white">
                <option value="expense">รายจ่าย (-)</option>
                <option value="income">รายรับ (+)</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] text-gray-500 mb-1">จำนวนเงิน (บาท)</label>
              <input type="number" id="tx-amount" step="any" min="0" placeholder="0.00" required class="w-full px-2 py-1.5 text-xs border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white">
            </div>
          </div>

          <div>
            <label class="block text-[11px] text-gray-500 mb-1">คำอธิบาย / โน้ต</label>
            <input type="text" id="tx-note" placeholder="เช่น ค่าอาหารกลางวัน" required class="w-full px-2 py-1.5 text-xs border rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white">
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 rounded-lg text-xs shadow transition">
            + บันทึกรายการ
          </button>
        </form>

        <!-- Transaction History List -->
        <div>
          <h3 class="text-xs font-bold text-gray-600 uppercase mb-2">ประวัติรายการ</h3>
          <ul id="tx-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
            <li class="text-center text-xs text-gray-400 py-4">กำลังโหลดข้อมูล...</li>
          </ul>
        </div>

      </section>

    </main>

    <!-- Footer Status Banner -->
    <footer id="auth-status-bar" class="bg-gray-100 p-2 text-center text-[10px] text-gray-500 border-t border-gray-100">
      สถานะ: ยังไม่ได้เข้าสู่ระบบ
    </footer>
  </div>

  <!-- Application Logic -->
  <script>
    // =========================================================================
    // 1. FIREBASE CONFIGURATION
    // =========================================================================
    const firebaseConfig = {
  apiKey: "AIzaSyCuu9m390tra3oEca4PygcD1pO6-L7u7XE",
  authDomain: "eard-604d1.firebaseapp.com",
  projectId: "eard-604d1",
  storageBucket: "eard-604d1.firebasestorage.app",
  messagingSenderId: "114087782046",
  appId: "1:114087782046:web:3c7c8dce10134cefba3d8f",
  measurementId: "G-RBTCMEJRNE"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    db.enablePersistence().catch((err) => {
      console.warn("Firestore Persistence Warning:", err.code);
    });

    let currentUser = null;
    let unsubscribeSnapshot = null;

    // DOM Elements
    const loginView = document.getElementById('login-view');
    const registerView = document.getElementById('register-view');
    const dashboardView = document.getElementById('dashboard-view');
    const logoutBtn = document.getElementById('logout-btn');
    const authStatusBar = document.getElementById('auth-status-bar');

    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');
    const regEmailInput = document.getElementById('reg-email');
    const regPasswordInput = document.getElementById('reg-password');
    const regConfirmInput = document.getElementById('reg-confirm-password');

    // =========================================================================
    // 2. VIEW SWITCHING
    // =========================================================================
    function showView(viewName) {
      loginView.classList.add('hidden');
      registerView.classList.add('hidden');
      dashboardView.classList.add('hidden');
      logoutBtn.classList.add('hidden');

      if (viewName === 'login') {
        loginView.classList.remove('hidden');
        authStatusBar.innerText = 'สถานะ: ยังไม่ได้เข้าสู่ระบบ';
      } else if (viewName === 'register') {
        registerView.classList.remove('hidden');
        authStatusBar.innerText = 'สถานะ: กำลังสมัครสมาชิกใหม่';
      } else if (viewName === 'dashboard') {
        dashboardView.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        authStatusBar.innerText = `เข้าสู่ระบบในชื่อ: ${currentUser.email || currentUser.displayName}`;
      }
    }

    // =========================================================================
    // 3. AUTHENTICATION (Email + Google)
    // =========================================================================

    document.getElementById('go-to-register-btn').addEventListener('click', () => {
      regEmailInput.value = loginEmailInput.value;
      regPasswordInput.value = loginPasswordInput.value;
      regConfirmInput.value = '';
      showView('register');
    });

    document.getElementById('back-to-login-btn').addEventListener('click', () => {
      showView('login');
    });

    // Login with Email
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = loginEmailInput.value.trim();
      const password = loginPasswordInput.value;

      if (!email || !password) {
        alert("กรุณากรอกอีเมลและรหัสผ่านให้ครบถ้วน");
        return;
      }

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        if (!user.emailVerified) {
          alert("อีเมลนี้ยังไม่ได้ยืนยันตัวตน! กรุณาตรวจสอบลิงก์ในอีเมลก่อนเข้าใช้งาน");
          await auth.signOut();
          return;
        }
      } catch (error) {
        console.error("Login Error:", error);
        alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือยังไม่ได้เป็นสมาชิก");
      }
    });

    // Login with Google
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (error) {
        console.error("Google Login Error:", error);
        alert("ไม่สามารถเข้าสู่ระบบด้วย Google ได้: " + error.message);
      }
    });

    // Register with Email
    document.getElementById('register-btn').addEventListener('click', async () => {
      const email = regEmailInput.value.trim();
      const password = regPasswordInput.value;
      const confirmPassword = regConfirmInput.value;

      if (!email || !password || !confirmPassword) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง");
        return;
      }
      if (password !== confirmPassword) {
        alert("รหัสผ่านไม่ตรงกัน");
        return;
      }
      if (password.length < 6) {
        alert("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");
        return;
      }

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        await userCredential.user.sendEmailVerification();
        alert(`ส่งลิงก์ยืนยันไปที่ ${email} แล้ว กรุณาตรวจสอบอีเมลก่อนเข้าสู่ระบบ`);
        await auth.signOut();
        showView('login');
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          alert("อีเมลนี้ถูกใช้งานแล้ว");
        } else {
          alert("เกิดข้อผิดพลาด: " + error.message);
        }
      }
    });

    logoutBtn.addEventListener('click', async () => {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      await auth.signOut();
    });

    // Auth State Observer
    auth.onAuthStateChanged((user) => {
      if (user) {
        if (user.providerData.some(p => p.providerId !== 'password') || user.emailVerified) {
          currentUser = user;
          showView('dashboard');
          loadTransactionsRealtime(user.uid);
        } else {
          currentUser = null;
          showView('login');
        }
      } else {
        currentUser = null;
        showView('login');
      }
    });

    // =========================================================================
    // 4. DATABASE & DASHBOARD
    // =========================================================================
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const type = document.getElementById('tx-type').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const note = document.getElementById('tx-note').value.trim();

      if (isNaN(amount) || amount <= 0) {
        alert("กรุณากรอกจำนวนเงินให้ถูกต้อง");
        return;
      }

      try {
        await db.collection('users').doc(currentUser.uid).collection('transactions').add({
          type: type,
          amount: amount,
          note: note,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('tx-amount').value = '';
        document.getElementById('tx-note').value = '';
      } catch (error) {
        alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message);
      }
    });

    async function deleteTransaction(docId) {
      if (!currentUser) return;
      if (confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) {
        try {
          await db.collection('users').doc(currentUser.uid).collection('transactions').doc(docId).delete();
        } catch (error) {
          alert("ลบไม่สำเร็จ: " + error.message);
        }
      }
    }

    function loadTransactionsRealtime(userId) {
      const listEl = document.getElementById('tx-list');
      
      unsubscribeSnapshot = db.collection('users').doc(userId).collection('transactions')
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          let totalIncome = 0;
          let totalExpense = 0;
          listEl.innerHTML = '';

          if (snapshot.empty) {
            listEl.innerHTML = '<li class="text-center text-xs text-gray-400 py-4">ยังไม่มีรายการบันทึก</li>';
          } else {
            snapshot.forEach((doc) => {
              const item = doc.data();
              const id = doc.id;
              const isIncome = item.type === 'income';
              
              if (isIncome) totalIncome += item.amount;
              else totalExpense += item.amount;

              const li = document.createElement('li');
              li.className = 'flex justify-between items-center p-2.5 bg-gray-50 border border-gray-100 rounded-lg text-xs';
              li.innerHTML = `
                <div class="flex flex-col">
                  <span class="font-medium text-gray-700">${escapeHtml(item.note)}</span>
                  <span class="text-[10px] text-gray-400">${isIncome ? 'รายรับ' : 'รายจ่าย'}</span>
                </div>
                <div class="flex items-center space-x-2">
                  <span class="font-bold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                    ${isIncome ? '+' : '-'}฿${item.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                  </span>
                  <button onclick="deleteTransaction('${id}')" class="text-gray-300 hover:text-rose-500 font-bold px-1 text-sm">
                    ×
                  </button>
                </div>
              `;
              listEl.appendChild(li);
            });
          }

          const balance = totalIncome - totalExpense;
          document.getElementById('total-income').innerText = `฿${totalIncome.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
          document.getElementById('total-expense').innerText = `฿${totalExpense.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
          document.getElementById('total-balance').innerText = `฿${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        });
    }

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
